[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "integrating-mlops-in-travel"
version = "0.1.0"
description = "Travel machine learning experiments and a flight price prediction API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0",
    "gunicorn>=21.2.0; sys_platform != 'win32'",
    "scikit-learn==1.6.1",
    "lightgbm>=4.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.0.0",
    "ipykernel>=6.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

# This repository currently uses scripts and notebooks rather than a Python package.
# Install project dependencies without auto-discovering data/model directories.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]
